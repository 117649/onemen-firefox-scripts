autoInstallPeers: true
saveExact: true
minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - 'typescript'
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - '@typescript/native-preview*'
  - brace-expansion@5.0.8

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
